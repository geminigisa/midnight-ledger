<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Ledger — The Emerald Vault</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: 1280px; height: 720px; display: block; touch-action: none; background: #0b1026; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Midnight Ledger: sneak past the guards and cameras, crack the vault, grab the emerald and reach the exit"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
